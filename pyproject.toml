[project]
name = "nederland-mcp"
version = "0.21.0"
description = "Hey Joost: live Nederlandse open data voor AI-assistenten (MCP-server): trein, bus en tram, weer, water, schoolvakanties, huis, verkeer, bekendmakingen, open in de buurt, reisadvies en regelzaken."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Mohamed Azahrioui" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.13.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "tzdata>=2026.5",
]

[project.scripts]
nederland-mcp = "nederland_mcp:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
